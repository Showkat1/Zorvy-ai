name: zorvy

services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zorvy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zorvy}
      POSTGRES_DB: ${POSTGRES_DB:-zorvy}
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/docker,
      # so the volume must be mounted at /var/lib/postgresql (not .../data).
      - postgres-data:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - zorvy

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ZORVY_ENVIRONMENT: ${ZORVY_ENVIRONMENT:-development}
      ZORVY_DEBUG: ${ZORVY_DEBUG:-false}
      ZORVY_LOG_JSON: ${ZORVY_LOG_JSON:-true}
      ZORVY_LOG_LEVEL: ${ZORVY_LOG_LEVEL:-INFO}
      ZORVY_SECRET_KEY: ${ZORVY_SECRET_KEY:?Set ZORVY_SECRET_KEY in .env}
      ZORVY_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-zorvy}:${POSTGRES_PASSWORD:-zorvy}@db:5432/${POSTGRES_DB:-zorvy}
      ZORVY_AUTO_CREATE_TABLES: "false"
      ZORVY_SEED_KNOWLEDGE_ON_STARTUP: "true"
      ZORVY_CORS_ORIGINS: ${ZORVY_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      ZORVY_FRONTEND_URL: ${ZORVY_FRONTEND_URL:-http://localhost:3000}
      ZORVY_COOKIE_SECURE: ${ZORVY_COOKIE_SECURE:-false}
      ZORVY_COOKIE_DOMAIN: ${ZORVY_COOKIE_DOMAIN:-}
      ZORVY_LLM_ENABLED: ${ZORVY_LLM_ENABLED:-true}
      ZORVY_LLM_API_KEY: ${ZORVY_LLM_API_KEY:-}
      ZORVY_LLM_BASE_URL: ${ZORVY_LLM_BASE_URL:-https://openrouter.ai/api/v1}
      ZORVY_LLM_MODEL: ${ZORVY_LLM_MODEL:-openrouter/free}
      ZORVY_EMBEDDING_PROVIDER: ${ZORVY_EMBEDDING_PROVIDER:-hash}
      ZORVY_OCR_ENABLED: "true"
      ZORVY_MAX_UPLOAD_SIZE_MB: ${ZORVY_MAX_UPLOAD_SIZE_MB:-10}
      ZORVY_RATE_LIMIT_ENABLED: ${ZORVY_RATE_LIMIT_ENABLED:-true}
      ZORVY_PIPELINE_MODE: ${ZORVY_PIPELINE_MODE:-background}
      # Billing is optional: empty keys keep the Free plan working while
      # checkout reports billing_not_configured.
      ZORVY_BILLING_CURRENCY: ${ZORVY_BILLING_CURRENCY:-INR}
      ZORVY_BILLING_TOTAL_COUNT: ${ZORVY_BILLING_TOTAL_COUNT:-120}
      ZORVY_FREE_INVESTIGATIONS_PER_MONTH: ${ZORVY_FREE_INVESTIGATIONS_PER_MONTH:-5}
      ZORVY_FREE_DEVICE_SCANS_PER_MONTH: ${ZORVY_FREE_DEVICE_SCANS_PER_MONTH:-3}
      ZORVY_PRO_DEVICE_SCANS_PER_MONTH: ${ZORVY_PRO_DEVICE_SCANS_PER_MONTH:-30}
      ZORVY_RAZORPAY_KEY_ID: ${ZORVY_RAZORPAY_KEY_ID:-}
      ZORVY_RAZORPAY_KEY_SECRET: ${ZORVY_RAZORPAY_KEY_SECRET:-}
      ZORVY_RAZORPAY_WEBHOOK_SECRET: ${ZORVY_RAZORPAY_WEBHOOK_SECRET:-}
      ZORVY_RAZORPAY_PLAN_PRO: ${ZORVY_RAZORPAY_PLAN_PRO:-}
      ZORVY_RAZORPAY_PLAN_STANDARD: ${ZORVY_RAZORPAY_PLAN_STANDARD:-}
      # Knowledge base is read-only; uploads live in a writable named volume
      # (a volume cannot be nested inside a read-only bind mount).
      ZORVY_UPLOAD_DIR: /uploads
    volumes:
      - ./data:/data:ro
      - uploads-data:/uploads
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - zorvy

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks:
      - zorvy

volumes:
  postgres-data:
  uploads-data:

networks:
  zorvy:
    driver: bridge
